substitutions:
  name: m5stack-atom-echo-23ed44
  friendly_name: M5Stack Atom Echo 23ed44
  # micro_wake_word_model: hey_jarvis  # okay_nabu alexa, hey_jarvis, hey_mycroft are also supported

packages:
  #m5stack.atom-echo-voice-assistant: github://MattChubb/wake-word-voice-assistants/m5stack-atom-echo/m5stack-atom-echo.lite.yaml@main
  # m5stack.atom-echo-voice-assistant: github://esphome/wake-word-voice-assistants/m5stack-atom-echo/m5stack-atom-echo.yaml@main
  m5stack.atom-echo-voice-assistant: github://esphome/media-players/m5stack/m5stack-atom-echo.yaml@main

# voice_assistant:
#   vad_threshold: !remove
# light:
#   - platform: esp32_rmt_led_strip
#     rmt_channel: !remove

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    # REAL KEY IS IN secrets.yaml (config/secrets.yaml, gitignored).
    # Replace before flashing — the previous value was exposed.
    key: "!secret api_encryption_key"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true
bluetooth_proxy:
    active: true

i2c:
  - id: bus_a
    sda: 26
    scl: 32
    scan: False

#TODO Combine this into one multiline field
text:
  - platform: template
    id: display_text1
    optimistic: true
    mode: text
    name: "Display text line 1"
    initial_value: "Hello, world!"
  - platform: template
    id: display_text2
    optimistic: true
    mode: text
    name: "Display text line 2"
    initial_value: "Hello, world!"
  - platform: template
    id: display_text3
    optimistic: true
    mode: text
    name: "Display text line 3"
    initial_value: "Hello, world!"
  - platform: template
    id: display_text4
    optimistic: true
    mode: text
    name: "Display text line 4"
    initial_value: "Hello, world!"
  - platform: template
    id: display_text5
    optimistic: true
    mode: text
    name: "Display text line 5"
    initial_value: "Hello, world!"
  - platform: template
    id: display_text6
    optimistic: true
    mode: text
    name: "Display text line 6"
    initial_value: "Hello, world!"
  - platform: template
    id: display_text7
    optimistic: true
    mode: text
    name: "Display text line 7"
    initial_value: "Hello, world!"
  - platform: template
    id: display_text8
    optimistic: true
    mode: text
    name: "Display text line 8"
    initial_value: "Hello, world!"

display:
  - platform: ssd1306_i2c
    model: "SH1107_128X64"
    i2c_id: bus_a
    address: 0x3C
    rotation: 90
    offset_y: 96
    update_interval: 5.0s
    auto_clear_enabled: true
    contrast: 0.1
    lambda: |-
      it.printf(0, 0, id(font1), "%s", id(display_text1).state.c_str());
      it.printf(0, 7, id(font1), "%s", id(display_text2).state.c_str());
      it.printf(0, 15, id(font1), "%s", id(display_text3).state.c_str());
      it.printf(0, 23, id(font1), "%s", id(display_text4).state.c_str());
      it.printf(0, 31, id(font1), "%s", id(display_text5).state.c_str());
      it.printf(0, 39, id(font1), "%s", id(display_text6).state.c_str());
      it.printf(0, 47, id(font1), "%s", id(display_text7).state.c_str());
      it.printf(0, 55, id(font1), "%s", id(display_text8).state.c_str());

font:
  - file: "UbuntuMono[wght].ttf"
    id: font1
    size: 9

external_components:
  - source: github://jenscski/esphome-components@main
    components: [ sh1107_base, sh1107_i2c ]